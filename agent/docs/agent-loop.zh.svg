<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="-apple-system, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="1240" height="640" fill="#ffffff"/>

  <!-- the agent policy -->
  <rect x="20" y="20" width="680" height="540" rx="16" fill="#f7f9fc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="40" y="50" font-size="16" font-weight="600" fill="#2d3748">Agent policy</text>

  <!-- 1 what the model sees -->
  <rect x="50" y="70" width="290" height="230" rx="12" fill="#ebf4ff" stroke="#4c7bd9" stroke-width="1.5"/>
  <text x="195" y="98" font-size="15" font-weight="600" fill="#1a365d" text-anchor="middle">每一轮模型看到的内容</text>
  <!-- layers -->
  <rect x="66" y="112" width="258" height="44" rx="6" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="78" y="131" font-size="12.5" font-weight="600" fill="#2d3748">规则与目标</text>
  <text x="78" y="148" font-size="11.5" fill="#4a5568">固定不变：优化目标、哪些参数不能改</text>
  <rect x="66" y="162" width="258" height="56" rx="6" fill="#faf5ff" stroke="#e9d8fd"/>
  <text x="78" y="181" font-size="12.5" font-weight="600" fill="#2d3748">最近的对话</text>
  <text x="78" y="197" font-size="11.5" fill="#4a5568">装满时丢弃旧的轮次，</text>
  <text x="78" y="211" font-size="11.5" fill="#4a5568">先丢旧的推理过程</text>
  <rect x="66" y="224" width="258" height="64" rx="6" fill="#ffffff" stroke="#4c7bd9" stroke-width="1.5"/>
  <text x="78" y="243" font-size="12.5" font-weight="600" fill="#1a365d">实验记录：永不丢弃</text>
  <text x="78" y="260" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">production 683k · noise ±1.3%</text>
  <text x="78" y="276" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">#3 chunk 16384   −1.0%</text>

  <!-- 2 the model decides -->
  <rect x="430" y="70" width="240" height="230" rx="12" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="550" y="98" font-size="15" font-weight="600" fill="#44337a" text-anchor="middle">模型做决定</text>
  <text x="550" y="120" font-size="12.5" fill="#2d3748" text-anchor="middle">提出假设，选出</text>
  <text x="550" y="137" font-size="12.5" fill="#2d3748" text-anchor="middle">下一批实验</text>
  <rect x="444" y="156" width="212" height="72" rx="6" fill="#ffffff" stroke="#e9d8fd"/>
  <text x="454" y="176" font-size="11.5" fill="#4a5568" font-style="italic">“更大的 prefill chunk 拖慢了</text>
  <text x="454" y="192" font-size="11.5" fill="#4a5568" font-style="italic">decode。默认的 8192 是不是最优？</text>
  <text x="454" y="208" font-size="11.5" fill="#4a5568" font-style="italic">试试另一侧：4096。”</text>

  <text x="550" y="252" font-size="12" font-weight="600" fill="#44337a" text-anchor="middle">它仅有的工具</text>
  <text x="550" y="270" font-size="11.5" fill="#4a5568" text-anchor="middle">提交实验 · 检查 · 读日志</text>
  <text x="550" y="286" font-size="11.5" fill="#4a5568" text-anchor="middle">重新测量 · 写笔记 · 结束</text>

  <!-- 3 experiments run -->
  <rect x="430" y="380" width="240" height="150" rx="12" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/>
  <text x="550" y="408" font-size="15" font-weight="600" fill="#22543d" text-anchor="middle">运行实验</text>
  <text x="550" y="429" font-size="12.5" fill="#2d3748" text-anchor="middle">多个实验同时运行，</text>
  <text x="550" y="446" font-size="12.5" fill="#2d3748" text-anchor="middle">共享 GPU 预算</text>
  <rect x="444" y="460" width="212" height="56" rx="6" fill="#ffffff" stroke="#c6f6d5"/>
  <text x="454" y="480" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">8 cards = 4 trials × tp 2</text>
  <text x="454" y="496" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">#14 chunk 4096   −4.2%</text>
  <text x="454" y="512" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">#11 trtllm MoE   失败</text>

  <!-- 4 lab books -->
  <rect x="50" y="380" width="290" height="150" rx="12" fill="#fffaf0" stroke="#dd8a2b" stroke-width="1.5"/>
  <text x="195" y="408" font-size="15" font-weight="600" fill="#7b341e" text-anchor="middle">实验账本</text>
  <text x="195" y="429" font-size="12.5" fill="#2d3748" text-anchor="middle">测量结果、诊断过的失败、</text>
  <text x="195" y="446" font-size="12.5" fill="#2d3748" text-anchor="middle">模型自己的笔记</text>
  <rect x="64" y="460" width="262" height="56" rx="6" fill="#ffffff" stroke="#feebc8"/>
  <text x="74" y="480" font-size="11.5" fill="#4a5568">经验：chunk 8192 是最优点</text>
  <text x="74" y="496" font-size="11.5" fill="#4a5568">约束：trtllm MoE 需要</text>
  <text x="74" y="512" font-size="11.5" fill="#4a5568">Blackwell，H800 上不要用</text>

  <!-- loop arrows -->
  <line x1="342" y1="185" x2="426" y2="185" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="302" x2="550" y2="376" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="344" font-size="12" fill="#4a5568">提交配置</text>
  <line x1="428" y1="455" x2="344" y2="455" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="386" y="445" font-size="12" fill="#4a5568" text-anchor="middle">结果</text>
  <line x1="195" y1="378" x2="195" y2="302" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="185" y="345" font-size="12" fill="#4a5568" text-anchor="end">每轮重新生成</text>
  <!-- notes before trimming -->
  <path d="M432,296 C400,320 360,345 336,376" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="210" y="322" font-size="11.5" fill="#6b46c1" font-style="italic">丢弃旧轮次之前</text>
  <text x="210" y="337" font-size="11.5" fill="#6b46c1" font-style="italic">先把笔记写下来</text>

  <!-- platform -->
  <rect x="930" y="70" width="290" height="460" rx="16" fill="#f7fafc" stroke="#718096" stroke-width="1.5"/>
  <text x="1075" y="100" font-size="16" font-weight="600" fill="#2d3748" text-anchor="middle">AutoTune 平台</text>

  <text x="946" y="138" font-size="12.5" font-weight="600" fill="#2d3748">保存 agent 的最佳列表</text>
  <text x="946" y="155" font-size="11.5" fill="#4a5568">每出一个结果就更新</text>
  <text x="946" y="198" font-size="12.5" font-weight="600" fill="#2d3748">截止时：最终裁决</text>
  <text x="946" y="215" font-size="11.5" fill="#4a5568">先停掉 agent，再亲自启动最佳列表</text>
  <text x="946" y="230" font-size="11.5" fill="#4a5568">和线上配置，并排在同一个</text>
  <text x="946" y="245" font-size="11.5" fill="#4a5568">benchmark 上测量；由平台的数字</text>
  <text x="946" y="260" font-size="11.5" fill="#4a5568">而不是 agent 的数字决定胜者</text>
  <line x1="946" y1="300" x2="1204" y2="300" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="946" y="420" font-size="12.5" font-weight="600" fill="#2d3748">运行每一个实验</text>
  <text x="946" y="437" font-size="11.5" fill="#4a5568">在指定的卡上启动引擎，</text>
  <text x="946" y="452" font-size="11.5" fill="#4a5568">向它回放真实流量，返回</text>
  <text x="946" y="467" font-size="11.5" fill="#4a5568">测量数字和引擎日志</text>
  <line x1="946" y1="488" x2="1204" y2="488" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="946" y="512" font-size="12.5" font-weight="600" fill="#2d3748">跨夜保存笔记</text>

  <!-- exchanges: best list and the deadline -->
  <line x1="672" y1="140" x2="926" y2="140" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="131" font-size="12" fill="#2d3748" text-anchor="middle" font-style="italic">“目前我最好的配置”</text>
  <line x1="926" y1="215" x2="672" y2="215" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="800" y="206" font-size="12" fill="#c53030" text-anchor="middle" font-style="italic">“时间到，停止”</text>

  <!-- exchanges: experiments -->
  <line x1="672" y1="430" x2="926" y2="430" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="421" font-size="12" fill="#2d3748" text-anchor="middle" font-style="italic">“在 4–5 号卡上跑这个配置”</text>
  <line x1="926" y1="480" x2="672" y2="480" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="471" font-size="12" fill="#2d3748" text-anchor="middle" font-style="italic">“测量数字 + 引擎日志”</text>

  <!-- memory across nights -->
  <path d="M195,532 L195,592 L1075,592 L1075,532" fill="none" stroke="#dd8a2b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="635" y="584" font-size="12" fill="#7b341e" text-anchor="middle" font-style="italic">夜晚结束：“保存我的经验和约束”</text>
  <text x="635" y="612" font-size="12" fill="#7b341e" text-anchor="middle" font-style="italic">下一夜：“这是之前几夜学到的”</text>
</svg>
