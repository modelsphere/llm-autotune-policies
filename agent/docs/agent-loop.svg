<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="1040" height="620" fill="#ffffff"/>

  <!-- the agent policy -->
  <rect x="20" y="20" width="680" height="540" rx="16" fill="#f7f9fc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="40" y="50" font-size="16" font-weight="600" fill="#2d3748">Agent policy</text>

  <!-- 1 what the model sees -->
  <rect x="50" y="70" width="290" height="230" rx="12" fill="#ebf4ff" stroke="#4c7bd9" stroke-width="1.5"/>
  <text x="195" y="98" font-size="15" font-weight="600" fill="#1a365d" text-anchor="middle">What the model sees each turn</text>
  <!-- layers -->
  <rect x="66" y="112" width="258" height="44" rx="6" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="78" y="131" font-size="12.5" font-weight="600" fill="#2d3748">Rules and goal</text>
  <text x="78" y="148" font-size="11.5" fill="#4a5568">fixed: the objective, what may not change</text>
  <rect x="66" y="162" width="258" height="56" rx="6" fill="#faf5ff" stroke="#e9d8fd"/>
  <text x="78" y="181" font-size="12.5" font-weight="600" fill="#2d3748">Recent conversation</text>
  <text x="78" y="197" font-size="11.5" fill="#4a5568">old turns are dropped when it is full,</text>
  <text x="78" y="211" font-size="11.5" fill="#4a5568">old reasoning first</text>
  <rect x="66" y="224" width="258" height="64" rx="6" fill="#ffffff" stroke="#4c7bd9" stroke-width="1.5"/>
  <text x="78" y="243" font-size="12.5" font-weight="600" fill="#1a365d">Lab record — never dropped</text>
  <text x="78" y="260" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">production 683k · noise ±1.3%</text>
  <text x="78" y="276" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">#3 chunk 16384   −1.0%</text>

  <!-- 2 the model decides -->
  <rect x="430" y="70" width="240" height="230" rx="12" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="550" y="98" font-size="15" font-weight="600" fill="#44337a" text-anchor="middle">The model decides</text>
  <text x="550" y="120" font-size="12.5" fill="#2d3748" text-anchor="middle">forms a hypothesis, picks</text>
  <text x="550" y="137" font-size="12.5" fill="#2d3748" text-anchor="middle">the next experiments</text>
  <rect x="444" y="156" width="212" height="72" rx="6" fill="#ffffff" stroke="#e9d8fd"/>
  <text x="454" y="176" font-size="11.5" fill="#4a5568" font-style="italic">"Bigger prefill chunks stalled</text>
  <text x="454" y="192" font-size="11.5" fill="#4a5568" font-style="italic">decode. Is the default 8192 the</text>
  <text x="454" y="208" font-size="11.5" fill="#4a5568" font-style="italic">peak? Test the other side: 4096."</text>

  <text x="550" y="252" font-size="12" font-weight="600" fill="#44337a" text-anchor="middle">Its only tools</text>
  <text x="550" y="270" font-size="11.5" fill="#4a5568" text-anchor="middle">propose · check · read a log</text>
  <text x="550" y="286" font-size="11.5" fill="#4a5568" text-anchor="middle">measure again · write a note · done</text>

  <!-- 3 experiments run -->
  <rect x="430" y="380" width="240" height="150" rx="12" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/>
  <text x="550" y="408" font-size="15" font-weight="600" fill="#22543d" text-anchor="middle">Experiments run</text>
  <text x="550" y="429" font-size="12.5" fill="#2d3748" text-anchor="middle">several at once, sharing</text>
  <text x="550" y="446" font-size="12.5" fill="#2d3748" text-anchor="middle">the GPU budget</text>
  <rect x="444" y="460" width="212" height="56" rx="6" fill="#ffffff" stroke="#c6f6d5"/>
  <text x="454" y="480" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">8 cards = 4 trials × tp 2</text>
  <text x="454" y="496" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">#14 chunk 4096   −4.2%</text>
  <text x="454" y="512" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">#11 trtllm MoE   failed</text>

  <!-- 4 lab books -->
  <rect x="50" y="380" width="290" height="150" rx="12" fill="#fffaf0" stroke="#dd8a2b" stroke-width="1.5"/>
  <text x="195" y="408" font-size="15" font-weight="600" fill="#7b341e" text-anchor="middle">The lab books</text>
  <text x="195" y="429" font-size="12.5" fill="#2d3748" text-anchor="middle">measurements, diagnosed failures,</text>
  <text x="195" y="446" font-size="12.5" fill="#2d3748" text-anchor="middle">the model's own notes</text>
  <rect x="64" y="460" width="262" height="56" rx="6" fill="#ffffff" stroke="#feebc8"/>
  <text x="74" y="480" font-size="11.5" fill="#4a5568">Lesson: chunk 8192 is the peak</text>
  <text x="74" y="496" font-size="11.5" fill="#4a5568">Constraint: trtllm MoE needs</text>
  <text x="74" y="512" font-size="11.5" fill="#4a5568">Blackwell, never on H800</text>

  <!-- loop arrows -->
  <line x1="342" y1="185" x2="426" y2="185" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="302" x2="550" y2="376" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="344" font-size="12" fill="#4a5568">proposes configs</text>
  <line x1="428" y1="455" x2="344" y2="455" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="386" y="445" font-size="12" fill="#4a5568" text-anchor="middle">results</text>
  <line x1="195" y1="378" x2="195" y2="302" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="185" y="345" font-size="12" fill="#4a5568" text-anchor="end">rebuilt every turn</text>
  <!-- notes before trimming -->
  <path d="M432,296 C400,320 360,345 336,376" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="210" y="322" font-size="11.5" fill="#6b46c1" font-style="italic">notes written down</text>
  <text x="210" y="337" font-size="11.5" fill="#6b46c1" font-style="italic">before old turns go</text>

  <!-- platform -->
  <rect x="760" y="70" width="260" height="460" rx="16" fill="#f7fafc" stroke="#718096" stroke-width="1.5"/>
  <text x="890" y="100" font-size="16" font-weight="600" fill="#2d3748" text-anchor="middle">AutoTune platform</text>
  <text x="890" y="140" font-size="12.5" fill="#2d3748" text-anchor="middle">at the end, measures the finalists</text>
  <text x="890" y="157" font-size="12.5" fill="#2d3748" text-anchor="middle">and production side by side:</text>
  <text x="890" y="180" font-size="13" font-weight="600" fill="#2d3748" text-anchor="middle">that is the verdict</text>
  <line x1="780" y1="300" x2="1000" y2="300" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="890" y="446" font-size="12.5" fill="#2d3748" text-anchor="middle">launches each engine and</text>
  <text x="890" y="463" font-size="12.5" fill="#2d3748" text-anchor="middle">measures it with the benchmark</text>
  <line x1="780" y1="490" x2="1000" y2="490" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="890" y="514" font-size="12.5" fill="#2d3748" text-anchor="middle">keeps the books between nights</text>

  <!-- platform arrows -->
  <line x1="672" y1="185" x2="756" y2="185" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="714" y="175" font-size="12" fill="#4a5568" text-anchor="middle">finalists</text>
  <line x1="674" y1="455" x2="756" y2="455" stroke="#4a5568" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="715" y="445" font-size="12" fill="#4a5568" text-anchor="middle">launch</text>
  <text x="715" y="475" font-size="12" fill="#4a5568" text-anchor="middle">measure</text>
  <!-- memory across nights -->
  <path d="M195,532 L195,588 L890,588 L890,534" fill="none" stroke="#dd8a2b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="540" y="606" font-size="12" fill="#7b341e" text-anchor="middle">lessons, constraints and settled questions saved at the end; the next night starts from them</text>
</svg>
