name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk-copies-match:
    # Each policy directory vendors autotune_policy/ verbatim, because a policy
    # image must build with no package index reachable. The top-level
    # autotune_policy/ is the copy of record; this job stops the copies drifting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The vendored SDKs are identical to the copy of record
        run: |
          fail=0
          for policy in random-search chaos heuristic-search; do
            if ! diff -ru --exclude=__pycache__ autotune_policy "$policy/autotune_policy"; then
              echo "::error::$policy/autotune_policy has drifted from autotune_policy/"
              echo "::error::run scripts/sync-sdk.sh and commit the result"
              fail=1
            fi
          done
          exit $fail

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        policy: [random-search, chaos, heuristic-search]
    defaults:
      run:
        working-directory: ${{ matrix.policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # A full night against an in-memory platform: no network, no GPUs, no
      # running instance of the platform. If this is green the contract holds.
      - run: uv run --extra dev pytest -q
      - run: uv run --extra dev ruff check .

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: LICENSE is the Apache-2.0 text, unmodified
        run: |
          if ! grep -q "Apache License" LICENSE || ! grep -q "Version 2.0, January 2004" LICENSE; then
            echo "::error file=LICENSE::LICENSE is not the Apache-2.0 text."
            exit 1
          fi
      - name: No credentials committed
        run: |
          if git ls-files | grep -InE '(^|/)\.env$|\.kubeconfig$|\.pem$|(^|/)(id_rsa|id_ed25519)$'; then
            echo "::error::a credential file is tracked"
            exit 1
          fi

  image:
    # Each policy vendors the SDK, so its own directory is the build context.
    # Built on every push so a broken Dockerfile is caught in review. On a
    # version tag, random-search is also published to ghcr.io for amd64 and
    # arm64, so an install can register it without building anything; any
    # policy still builds from source for a registry of your own (README.md,
    # "Building an image").
    runs-on: ubuntu-latest
    needs: [sdk-copies-match, test]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        policy: [random-search, chaos, heuristic-search]
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.policy == 'random-search' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/llm-autotune-policy-${{ matrix.policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: The tag agrees with the policy's version
        if: env.PUBLISH == 'true'
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/^version = "\(.*\)"$/\1/p' "${{ matrix.policy }}/pyproject.toml")
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME != ${{ matrix.policy }} version $declared; bump ${{ matrix.policy }}/pyproject.toml"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: env.PUBLISH == 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.policy }}
          push: ${{ env.PUBLISH == 'true' }}
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          # A version tag only, never `latest`: a campaign must re-run the same
          # search, and nodes keep the image they already have.
          tags: ${{ env.PUBLISH == 'true' && format('{0}:{1}', env.IMAGE, steps.version.outputs.version) || format('llm-autotune-policy-{0}:ci', matrix.policy) }}
          # The source label links the package to this repository on ghcr.io.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=LLM AutoTune search policy: ${{ matrix.policy }}
            org.opencontainers.image.licenses=Apache-2.0
