name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  sdk-copies-match:
    # Each policy directory vendors autotune_policy/ verbatim, because a policy
    # image must build with no package index reachable. The top-level
    # autotune_policy/ is the copy of record; this job stops the copies drifting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The vendored SDKs are identical to the copy of record
        run: |
          fail=0
          for policy in random-search chaos; do
            if ! diff -ru --exclude=__pycache__ autotune_policy "$policy/autotune_policy"; then
              echo "::error::$policy/autotune_policy has drifted from autotune_policy/"
              echo "::error::run scripts/sync-sdk.sh and commit the result"
              fail=1
            fi
          done
          exit $fail

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        policy: [random-search, chaos]
    defaults:
      run:
        working-directory: ${{ matrix.policy }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # A full night against an in-memory platform: no network, no GPUs, no
      # running instance of the platform. If this is green the contract holds.
      - run: uv run --extra dev pytest -q
      - run: uv run --extra dev ruff check .

  hygiene:
    # Extracted from a private repository. Internal host and registry names are
    # not secrets, but they are noise and a slow leak of someone else's network
    # layout. Catch them here rather than in review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pattern='4pd\.io|4paradigm|hardcore-tech|inference-production-stack|harbor\.|pce-dev'
          if grep -rInE "$pattern" . --exclude-dir=.git --exclude=ci.yml; then
            echo "::error::internal identifier found — see the matches above"
            exit 1
          fi
          if ! grep -q "Apache License" LICENSE; then
            echo "::error::LICENSE is not the Apache-2.0 text"
            exit 1
          fi

  image:
    # Each policy vendors the SDK, so its own directory is the build context.
    # Built on every push so a broken Dockerfile is caught in review. Nothing is
    # published: a policy runs from an image its user builds and puts where their
    # GPU machines can pull it (see README.md, "Building an image").
    runs-on: ubuntu-latest
    needs: [sdk-copies-match, test]
    permissions:
      contents: read
    strategy:
      matrix:
        policy: [random-search, chaos]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.policy }}
          push: false
          tags: llm-autotune-policy-${{ matrix.policy }}:ci
