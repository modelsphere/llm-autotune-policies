<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>

  <!-- the agent policy -->
  <rect x="20" y="20" width="640" height="500" rx="16" fill="#f7f9fc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="40" y="50" font-size="16" font-weight="600" fill="#2d3748">Agent policy</text>

  <!-- 1 what we know -->
  <rect x="50" y="75" width="240" height="150" rx="12" fill="#ebf4ff" stroke="#4c7bd9" stroke-width="1.5"/>
  <text x="170" y="104" font-size="15" font-weight="600" fill="#1a365d" text-anchor="middle">What we know</text>
  <text x="170" y="125" font-size="12.5" fill="#2d3748" text-anchor="middle">a fresh summary of every result,</text>
  <text x="170" y="142" font-size="12.5" fill="#2d3748" text-anchor="middle">failure and lesson so far</text>
  <rect x="64" y="156" width="212" height="56" rx="6" fill="#ffffff" stroke="#c3dafe"/>
  <text x="74" y="176" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">production   683k tpm/GPU</text>
  <text x="74" y="192" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">noise        ±1.3%</text>
  <text x="74" y="208" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">#13 fusion off   −3.1%</text>

  <!-- 2 the model decides -->
  <rect x="390" y="75" width="240" height="150" rx="12" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="510" y="104" font-size="15" font-weight="600" fill="#44337a" text-anchor="middle">The model decides</text>
  <text x="510" y="125" font-size="12.5" fill="#2d3748" text-anchor="middle">forms a hypothesis, picks</text>
  <text x="510" y="142" font-size="12.5" fill="#2d3748" text-anchor="middle">the next experiments</text>
  <rect x="404" y="156" width="212" height="56" rx="6" fill="#ffffff" stroke="#e9d8fd"/>
  <text x="414" y="176" font-size="11.5" fill="#4a5568" font-style="italic">"The log shows no prefix reuse,</text>
  <text x="414" y="192" font-size="11.5" fill="#4a5568" font-style="italic">so the radix cache is overhead:</text>
  <text x="414" y="208" font-size="11.5" fill="#4a5568" font-style="italic">try disable_radix_cache."</text>

  <!-- 3 experiments run -->
  <rect x="390" y="345" width="240" height="150" rx="12" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/>
  <text x="510" y="374" font-size="15" font-weight="600" fill="#22543d" text-anchor="middle">Experiments run</text>
  <text x="510" y="395" font-size="12.5" fill="#2d3748" text-anchor="middle">several at once, sharing</text>
  <text x="510" y="412" font-size="12.5" fill="#2d3748" text-anchor="middle">the GPU budget</text>
  <rect x="404" y="426" width="212" height="56" rx="6" fill="#ffffff" stroke="#c6f6d5"/>
  <text x="414" y="446" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">8 cards = 4 trials × tp 2</text>
  <text x="414" y="462" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">#16 radix off   697k</text>
  <text x="414" y="478" font-size="11.5" fill="#4a5568" font-family="Menlo, Consolas, monospace">#11 trtllm MoE  failed</text>

  <!-- 4 lab books -->
  <rect x="50" y="345" width="240" height="150" rx="12" fill="#fffaf0" stroke="#dd8a2b" stroke-width="1.5"/>
  <text x="170" y="374" font-size="15" font-weight="600" fill="#7b341e" text-anchor="middle">The lab books</text>
  <text x="170" y="395" font-size="12.5" fill="#2d3748" text-anchor="middle">measurements, diagnosed</text>
  <text x="170" y="412" font-size="12.5" fill="#2d3748" text-anchor="middle">failures, the model's notes</text>
  <rect x="64" y="426" width="212" height="56" rx="6" fill="#ffffff" stroke="#feebc8"/>
  <text x="74" y="446" font-size="11.5" fill="#4a5568">Lesson: chunk 8192 is the peak</text>
  <text x="74" y="462" font-size="11.5" fill="#4a5568">Constraint: trtllm MoE needs</text>
  <text x="74" y="478" font-size="11.5" fill="#4a5568">Blackwell, never on H800</text>

  <!-- loop arrows -->
  <line x1="292" y1="150" x2="386" y2="150" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="227" x2="510" y2="341" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="289" font-size="12" fill="#4a5568">proposes configs</text>
  <line x1="388" y1="420" x2="294" y2="420" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="341" y="410" font-size="12" fill="#4a5568" text-anchor="middle">results</text>
  <line x1="170" y1="343" x2="170" y2="229" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="289" font-size="12" fill="#4a5568" text-anchor="end">rebuilt every turn</text>

  <!-- centre note -->
  <text x="340" y="278" font-size="12.5" fill="#718096" text-anchor="middle" font-style="italic">woken when a</text>
  <text x="340" y="296" font-size="12.5" fill="#718096" text-anchor="middle" font-style="italic">result lands</text>

  <!-- platform -->
  <rect x="720" y="75" width="260" height="420" rx="16" fill="#f7fafc" stroke="#718096" stroke-width="1.5"/>
  <text x="850" y="106" font-size="16" font-weight="600" fill="#2d3748" text-anchor="middle">AutoTune platform</text>
  <text x="850" y="140" font-size="12.5" fill="#2d3748" text-anchor="middle">at the end, measures the</text>
  <text x="850" y="157" font-size="12.5" fill="#2d3748" text-anchor="middle">finalists and production itself:</text>
  <text x="850" y="180" font-size="13" font-weight="600" fill="#2d3748" text-anchor="middle">that is the verdict</text>
  <rect x="740" y="196" width="220" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="850" y="221" font-size="11.5" fill="#4a5568" text-anchor="middle" font-family="Menlo, Consolas, monospace">finalist +2.0% vs production</text>
  <line x1="740" y1="300" x2="960" y2="300" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="850" y="412" font-size="12.5" fill="#2d3748" text-anchor="middle">launches each engine and</text>
  <text x="850" y="429" font-size="12.5" fill="#2d3748" text-anchor="middle">measures it with the benchmark</text>

  <!-- platform arrows -->
  <line x1="632" y1="150" x2="716" y2="150" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="674" y="140" font-size="12" fill="#4a5568" text-anchor="middle">finalists</text>
  <line x1="634" y1="420" x2="716" y2="420" stroke="#4a5568" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="675" y="410" font-size="12" fill="#4a5568" text-anchor="middle">launch</text>
  <text x="675" y="440" font-size="12" fill="#4a5568" text-anchor="middle">measure</text>
</svg>
